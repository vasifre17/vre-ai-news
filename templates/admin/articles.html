<!doctype html><html><body><h2>{{status}} Articles</h2>{% for a in articles %}{% set n = narration_map.get(a.id) %}<div><a href="/admin/articles/{{a.id}}/edit">{{a.title}}</a> - {{a.category}} | Narration: {{ n.status if n else 'pending' }} {% if a.status=='draft' %}<form method="post" action="/admin/articles/{{a.id}}/publish"><button>Publish</button></form>{% endif %}<form method="post" action="/admin/articles/{{a.id}}/narration/regenerate"><button>Regenerate narration</button></form></div>{% endfor %}</body></html>
