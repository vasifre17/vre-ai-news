<!doctype html><html><body><h2>{{status}} Articles</h2>{% for a in articles %}<div><a href="/admin/articles/{{a.id}}/edit">{{a.title}}</a> - {{a.category}} {% if a.status=='draft' %}<form method="post" action="/admin/articles/{{a.id}}/publish"><button>Publish</button></form>{% endif %}</div>{% endfor %}</body></html>
