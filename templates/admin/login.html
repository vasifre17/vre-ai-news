<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VREYC Admin Login</title>
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-mark">V</div>
    <p class="eyebrow">Secure admin access</p>
    <h1>Welcome back</h1>
    <p class="muted">Sign in to manage VREYC articles, media, translations and publishing operations.</p>
    {% if error %}<div class="alert danger">{{ error }}</div>{% endif %}
    <form method="post" class="stack">
      <label>Username<input name="username" autocomplete="username" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary full" type="submit">Login to dashboard</button>
    </form>
  </main>
</body>
</html>
