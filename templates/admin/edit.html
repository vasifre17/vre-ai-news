<!doctype html><html><head><title>Edit Article | VREYC Admin</title></head><body><h2>VREYC Admin — Edit Article</h2><form method="post"><input name="title" value="{{article.title}}"><input name="category" value="{{article.category}}"><input name="image_url" value="{{article.image_url}}"><input name="seo_title" value="{{article.seo_title}}"><input name="tags" value="{{article.tags}}"><textarea name="content">{{article.content}}</textarea><button>Save</button></form>
<h3>Narration</h3><p>Status: {{narration.status if narration else 'pending'}} | Enabled: {{article.narration_enabled}}</p>
<form method="post" action="/admin/articles/{{article.id}}/narration/toggle"><input type="hidden" name="enabled" value="{{'false' if article.narration_enabled else 'true'}}"><button>{{'Disable' if article.narration_enabled else 'Enable'}} narration</button></form>
<form method="post" action="/admin/articles/{{article.id}}/narration/regenerate"><button>Regenerate narration</button></form>
<form method="post" action="/admin/articles/{{article.id}}/narration/delete"><button>Delete narration</button></form>
{% if narration and narration.audio_path %}<audio controls src="{{narration.audio_path}}"></audio>{% endif %}
</body></html>
